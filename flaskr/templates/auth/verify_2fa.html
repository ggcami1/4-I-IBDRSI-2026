{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Verificación en Dos Pasos{% endblock %}</h1>
{% endblock %}

{% block content %}
<p>Ingresa el código de 6 dígitos de Google Authenticator, o uno de tus códigos de respaldo.</p>

<form method="post">
  <label for="code">Código</label>
  <input id="code" name="code" placeholder="Código de 6 dígitos" maxlength="8"
         inputmode="numeric" autocomplete="one-time-code" required autofocus>
  <input type="submit" value="Verificar">
</form>

<p style="margin-top:1rem;">
  <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
</p>
{% endblock %}
