<!doctype html>
<title>{% block title %}{% endblock %} -Sistema de Calificaciones</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<nav>
  <h1>Sistema de Calificaciones</h1>
  <ul>
    {% if g.user %}
      <li><span>{{ g.user['username'] }}</span>
      <li><a href="{{ url_for('auth.setup_2fa') }}">2FA</a>
      <li><a href="{{ url_for('auth.logout') }}">Cerrar Sesión</a>
    {% else %}
      <li><a href="{{ url_for('auth.register') }}">Registrarse</a>
      <li><a href="{{ url_for('auth.login') }}">Iniciar Sesión</a>
    {% endif %}
  </ul>
</nav>
<section class="content">
  <header>
    {% block header %}{% endblock %}
  </header>
  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</section>
