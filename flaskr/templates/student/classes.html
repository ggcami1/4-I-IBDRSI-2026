{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Clases{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="mgmt-layout">

  <div class="mgmt-list">
    <table class="mgmt-table">
      <thead>
        <tr>
          <th>Clase</th>
          <th>Semestre</th>
        </tr>
      </thead>
      <tbody>
        {% for c in classes %}
          <tr>
            <td>{{ c['name'] }}</td>
            <td>{{ c['semester'] }}</td>
          </tr>
        {% else %}
          <tr><td colspan="2">No hay clases registradas.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="mgmt-form">
    <h3>Agregar Clase</h3>
    <form method="post">
      <label for="name">Nombre de la clase</label>
      <input type="text" name="name" id="name" placeholder="ej. Cálculo" required>

      <label for="semester">Semestre</label>
      <select name="semester" id="semester" required>
        <option value="">-- Selecciona --</option>
        {% for n in range(1, 7) %}
          <option value="{{ n }}">Semestre {{ n }}</option>
        {% endfor %}
      </select>

      <button type="submit">Agregar</button>
    </form>
  </div>

</div>
{% endblock %}
