{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Grupos{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="mgmt-layout">

  <div class="mgmt-list">
    <table class="mgmt-table">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Turno</th>
        </tr>
      </thead>
      <tbody>
        {% for g in groups %}
          <tr>
            <td>{{ g['name'].upper() }}</td>
            <td>{{ g['turno'] }}</td>
          </tr>
        {% else %}
          <tr><td colspan="2">No hay grupos registrados.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="mgmt-form">
    <h3>Agregar Grupo</h3>
    <form method="post">
      <label for="name">Nombre del grupo</label>
      <input type="text" name="name" id="name" placeholder="ej. c" required>

      <label for="swift_id">Turno</label>
      <select name="swift_id" id="swift_id" required>
        <option value="">-- Selecciona --</option>
        {% for s in swifts %}
          <option value="{{ s['id'] }}">{{ s['name'] }}</option>
        {% endfor %}
      </select>

      <button type="submit">Agregar</button>
    </form>
  </div>

</div>
{% endblock %}
